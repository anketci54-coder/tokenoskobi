# Tokenoskobi / Coinoskobi panel Nginx template
# Server: Netcup
# Purpose: expose active static panel safely through domain with reverse proxy
# Replace panel.coinoskobi.xyz before installing.

server {
    server_name panel.coinoskobi.xyz;

    # Certbot may replace this block with HTTPS redirect after SSL issue.

    location / {
        proxy_pass http://127.0.0.1:8096/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location = /healthz {
        access_log off;
        return 200 'ok\n';
        add_header Content-Type text/plain;
    }

    # TOKENOSKOBI_NEWS_PUBLIC_ROUTE_FIX_V1
    


    # TOKENOSKOBI_NEWS_PUBLIC_ROUTE_FIX_V1_INDEX
    



    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/panel.coinoskobi.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/panel.coinoskobi.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


    # TOKENOSKOBI_NEWS_PUBLIC_403_FIX_V1
    location = /panel/panel_v2/news_coverage.html {
        auth_basic off;
        root /var/www/tokenoskobi_public;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        try_files /panel/panel_v2/news_coverage.html =404;
    }

    # TOKENOSKOBI_NEWS_PUBLIC_403_FIX_V1_INDEX
    location = /panel/panel_v2/ {
        auth_basic off;
        root /var/www/tokenoskobi_public;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        try_files /panel/panel_v2/index.html =404;
    }

}


server {
    if ($host = panel.coinoskobi.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name panel.coinoskobi.xyz;
    return 404; # managed by Certbot


}