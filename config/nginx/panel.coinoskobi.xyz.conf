# Tokenoskobi / Coinoskobi panel Nginx template
# Server: Netcup
# Purpose: expose active static panel safely through domain with reverse proxy
# Replace panel.coinoskobi.xyz before installing.

server {
    server_name panel.coinoskobi.xyz;

    # Certbot may replace this block with HTTPS redirect after SSL issue.

    location / {
        auth_basic "Tokenoskobi Private Panel";
        auth_basic_user_file /etc/nginx/.htpasswd_coinoskobi_xyz_panel;
        proxy_pass http://127.0.0.1:8096/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Paced GeckoTerminal collection can legitimately exceed 30 seconds.
        # Keep the upstream wait bounded while allowing one complete analysis.
        proxy_read_timeout 600s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 5s;
    }

    location = /healthz {
        access_log off;
        return 200 'ok\n';
        add_header Content-Type text/plain;
    }

    # TOKENOSKOBI_NEWS_PUBLIC_ROUTE_FIX_V1



    # TOKENOSKOBI_NEWS_PUBLIC_ROUTE_FIX_V1_INDEX




    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/panel.coinoskobi.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/panel.coinoskobi.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


    # TOKENOSKOBI_NEWS_PUBLIC_403_FIX_V1



    # TOKENOSKOBI_NEWS_PUBLIC_403_FIX_V1_INDEX




    # TOKENOSKOBI_NEWS_PUBLIC_403_OVERRIDE_V1_EXACT



    # TOKENOSKOBI_NEWS_PUBLIC_403_OVERRIDE_V1_INDEX



    # TOKENOSKOBI_NEWS_PUBLIC_403_OVERRIDE_V1_PREFIX




    # TOKENOSKOBI_NEWS_PUBLIC_403_OVERRIDE_V1_EXACT
    # TOKENOSKOBI_FIX6_AUTHENTICATED_ROOT_PROXY

    # TOKENOSKOBI_NEWS_PUBLIC_403_OVERRIDE_V1_INDEX
    # TOKENOSKOBI_FIX6_AUTHENTICATED_ROOT_PROXY

    # TOKENOSKOBI_NEWS_PUBLIC_403_OVERRIDE_V1_PREFIX
    # TOKENOSKOBI_FIX6_AUTHENTICATED_ROOT_PROXY

}


server {
    if ($host = panel.coinoskobi.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name panel.coinoskobi.xyz;
    return 404; # managed by Certbot



    # TOKENOSKOBI_NEWS_PUBLIC_403_OVERRIDE_V1_EXACT



    # TOKENOSKOBI_NEWS_PUBLIC_403_OVERRIDE_V1_INDEX



    # TOKENOSKOBI_NEWS_PUBLIC_403_OVERRIDE_V1_PREFIX




    # TOKENOSKOBI_NEWS_PUBLIC_403_OVERRIDE_V1_EXACT
    # TOKENOSKOBI_FIX6_AUTHENTICATED_ROOT_PROXY

    # TOKENOSKOBI_NEWS_PUBLIC_403_OVERRIDE_V1_INDEX
    # TOKENOSKOBI_FIX6_AUTHENTICATED_ROOT_PROXY

    # TOKENOSKOBI_NEWS_PUBLIC_403_OVERRIDE_V1_PREFIX
    # TOKENOSKOBI_FIX6_AUTHENTICATED_ROOT_PROXY

}
