name: ERA55 selection gate canonical sync PR trigger

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  canonical-sync:
    if: github.head_ref == 'automation/era55-selection-gate-sync-20260710'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4
        with:
          ref: automation/era55-selection-gate-sync-20260710
          fetch-depth: 0
          persist-credentials: true

      - name: Extract canonical sync program
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/era55-selection-gate-sync.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n          git diff --check"
          body = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          Path('/tmp/era55_gate_sync.py').write_text(textwrap.dedent(body) + '\n', encoding='utf-8')
          PY

      - name: Checkout main working tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

      - name: Apply canonical sync program
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 /tmp/era55_gate_sync.py

      - name: Validate canonical changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          runtime = json.loads(Path('PROJECT_RUNTIME.json').read_text(encoding='utf-8'))
          assert runtime['current_era'] == 'ERA54'
          assert runtime['next_safe_step']['id'] == 'ERA55_SELECTION_GATE'
          assert runtime['next_safe_step']['new_era_opened'] is False
          assert runtime['news_readonly_audit_closure']['proven_data_loss_count'] == 0
          print('VALIDATION_OK')
          PY
          git status --short

      - name: Commit canonical changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tokenoskobi GitHub Canonical Sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "ERA55_SELECTION_GATE_CANONICAL_BINDING_SYNC | OK | NO_NEW_ERA"

      - name: Push canonical commit to main
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main

      - name: Delete temporary automation branch
        if: success()
        shell: bash
        run: git push origin --delete automation/era55-selection-gate-sync-20260710 || true
