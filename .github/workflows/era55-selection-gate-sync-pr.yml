name: ERA55 selection gate canonical sync PR trigger

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  canonical-sync:
    if: github.head_ref == 'automation/era55-selection-gate-sync-20260710'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4
        with:
          ref: automation/era55-selection-gate-sync-20260710
          fetch-depth: 0
          persist-credentials: true

      - name: Extract canonical sync program
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/era55-selection-gate-sync.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n          git diff --check"
          body = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          Path('/tmp/era55_gate_sync.py').write_text(textwrap.dedent(body) + '\n', encoding='utf-8')
          PY

      - name: Apply to main and push one canonical commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          PYTHONDONTWRITEBYTECODE=1 python3 /tmp/era55_gate_sync.py
          git diff --check
          git config user.name "Tokenoskobi GitHub Canonical Sync"
          git config user.email "actions@users.noreply.github.com"
          git add \
            PROJECT_RUNTIME.json \
            PROJECT_BOOT.json \
            PROJECT_HISTORY.json \
            data/tokenoskobi_v1_v8_master_era_roadmap.json \
            data/control/news_readonly_audit_closure_20260710_v1.json \
            docs/canonical/NEWS_READONLY_AUDIT_CLOSURE_20260710_V1.md \
            03_ROADMAP.md \
            04_ALMANAC.md \
            05_ATLAS.md \
            06_PROJECT_MASTER_STATE.md \
            07_PROJECT_HANDOFF.md \
            reports/LATEST_TK_AI_HANDOFF.md
          git commit -m "ERA55_SELECTION_GATE_CANONICAL_BINDING_SYNC | OK | NO_NEW_ERA"
          git push origin HEAD:main

      - name: Delete temporary automation branch
        if: success()
        shell: bash
        run: git push origin --delete automation/era55-selection-gate-sync-20260710 || true
