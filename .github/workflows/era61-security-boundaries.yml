name: ERA61 Security Boundaries

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile Python sources
        run: python -m compileall -q core services scripts tests engineering tokenoskobi_kernel.py
      - name: Offline regression and authority boundary tests
        run: python -B -m unittest discover -s tests -v
      - name: Checkout health and smoke checks
        run: |
          python -B scripts/engineering/tokenoskobi_healthcheck.py --report /tmp/tokenoskobi-health.json
          python -B engineering/tests/smoke_test.py
      - name: Product entry points on isolated loopback ports
        run: python -B engineering/tests/product_runtime_smoke.py
      - name: HTTP lifecycle and restart persistence with offline providers
        run: python -B -m engineering.tests.product_e2e
