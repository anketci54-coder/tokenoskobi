name: ERA61 Security Boundaries

on:
  pull_request:
    paths:
      - "core/**"
      - "config/authority_state_v1.json"
      - "config/runtime_stage_grants_v1.json"
      - "tools/**"
      - "tests/test_era61_*.py"
      - ".github/workflows/era61-security-boundaries.yml"
  push:
    branches:
      - era61-core-security-hardening

permissions:
  contents: read

jobs:
  security-boundaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile hardened modules
        run: |
          python -m py_compile \
            core/authority.py \
            core/runtime_policy_authority_gate.py \
            core/research_execution_firewall.py \
            tools/system_center_live_producer_v1.py
      - name: Run ERA61 authority boundary tests
        run: |
          python -m pytest -q \
            tests/test_era61_authority_financial_boundaries.py \
            tests/test_era61_repository_security_surface.py
